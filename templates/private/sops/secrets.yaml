# PLACEHOLDER — this file is NOT encrypted yet.
#
# Replace it before your first deploy:
#   1. put real age recipients in sops/.sops.yaml
#   2. sops sops/secrets.yaml     (edits + encrypts in place)
#
# Every upstream module you import demands its own keys here, whether or not
# this machine uses them. See docs/upstream-contract.md before adding modules.
#
# Rename `youruser` to the account the upstream's user module defines.
passwords:
  # mkpasswd -m sha-512
  youruser: "$6$REPLACE$ME"
private_keys:
  # contents of ~/.ssh/id_ed25519 for that user
  youruser: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE ME
    -----END OPENSSH PRIVATE KEY-----
