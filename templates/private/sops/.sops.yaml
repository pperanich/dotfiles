# Who can decrypt this repo's secrets. Regenerate recipients after adding a
# machine:  sops updatekeys sops/secrets.yaml
keys:
  # You, for editing: ssh-to-age < ~/.ssh/id_ed25519.pub
  - &admin age1REPLACEME000000000000000000000000000000000000000000000
  # One per host, derived from its SSH host key:
  #   ssh-keyscan <host> | ssh-to-age
  - &example-nixos age1REPLACEME000000000000000000000000000000000000000001
  - &example-darwin age1REPLACEME000000000000000000000000000000000000000002
creation_rules:
  - path_regex: secrets\.yaml$
    key_groups:
      - age:
          - *admin
          - *example-nixos
          - *example-darwin
