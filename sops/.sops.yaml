# One sops file per host (admins + that host) plus the desktop user vault.
# Users: admin keys for editing. Hosts: age keys from each host's SSH key. Keys: hardware keys.
keys:
  # Admin user keys (for editing secrets from workstations)
  - &users "":
      - &pperanich-admin age1gm7hnljkwdn0uprqwzjxawj0l4ytgzrgjlc6qnw0gnws7zr424rsht6h2v
  # Host keys, derived from /etc/ssh/ssh_host_ed25519_key
  - &hosts "":
      - &pp-ml1-ssh age1d0jvrgrtlecphg8s2svaly2ql9hlpp60qhfldeznkj8q46ggmqjq67ptcx
      - &pp-nas1 age1vk22wnz747vrmyeft860uyazt7xa0zpj3ku0xsvn8lgn7rw7hqcqedwzd2
      - &pp-router1 age1netgxhgrtxzn6dzxqdvfxdkhc53wcehtf47yyh5p3tedgllqgfrs5kdm73
      - &pp-wsl1 age10fkqfduhmmg4z0evm6rery5eggsamtyjkgtsrmrz63d8jycrzqnssnxyv7
  # Hardware security keys
  - &keys "":
      - &yubikey0-slot1 age1yubikey1qdxm3n7yv2d065hewfmy3u5xk2n62udd8n992azmkzl9yp7mel3tgyzrzrv
      - &yubikey1-slot1 age1yubikey1qd08p9texfucjcjpf2uxc02zzytw983md4zsumtvkdxtrx5u9s94zdkmu2y
creation_rules:
  # Cloudflare Tunnel credentials (only admin + pp-router1)
  - path_regex: cloudflared-tunnel\.json$
    key_groups:
      - age:
          - *pperanich-admin
          - *yubikey0-slot1
          - *yubikey1-slot1
          - *pp-router1
  # Per-machine compartments (one file per host)
  - path_regex: (^|sops/)machines/pp-router1\.yaml$
    key_groups:
      - age:
          - *pperanich-admin
          - *yubikey0-slot1
          - *yubikey1-slot1
          - *pp-router1
  - path_regex: (^|sops/)machines/pp-nas1\.yaml$
    key_groups:
      - age:
          - *pperanich-admin
          - *yubikey0-slot1
          - *yubikey1-slot1
          - *pp-nas1
  - path_regex: (^|sops/)machines/pp-rpi1\.yaml$
    key_groups:
      - age:
          - *pperanich-admin
          - *yubikey0-slot1
          - *yubikey1-slot1
  - path_regex: (^|sops/)machines/pp-ml1\.yaml$
    key_groups:
      - age:
          - *pperanich-admin
          - *yubikey0-slot1
          - *yubikey1-slot1
          - *pp-ml1-ssh
  - path_regex: (^|sops/)machines/pp-wsl1\.yaml$
    key_groups:
      - age:
          - *pperanich-admin
          - *yubikey0-slot1
          - *yubikey1-slot1
          - *pp-wsl1
  # Physical desktop user secrets only (excludes servers and WSL)
  - path_regex: (^|sops/)users/pperanich-desktop\.yaml$
    key_groups:
      - age:
          - *pperanich-admin
          - *yubikey0-slot1
          - *yubikey1-slot1
          - *pp-ml1-ssh
