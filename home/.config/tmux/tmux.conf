# Set default-terminal, but fall back to a common value if the preferred one is not available.
# This makes the configuration more portable.
if-shell 'infocmp xterm-ghostty &>/dev/null' \
  'set -g default-terminal "xterm-ghostty"' \
  'set -g default-terminal "screen-256color"'

set -ag terminal-overrides ',xterm-ghostty:Tc,alacritty:Tc,xterm-256color:Tc,screen-256color:Tc'
set -g set-clipboard on

# Forward Kitty-protocol key events (Shift+Enter, Alt+Enter, ...) to
# applications that request them; pi and Claude Code need this for modified
# Enter keys. The extkeys terminal-feature tells tmux the outer terminal
# (xterm-ghostty) supports the protocol, so tmux requests it there too.
# allow-passthrough lets Claude Code's notifications/progress reach Ghostty.
set -g extended-keys on
# Report modified keys in Kitty csi-u format (pi's protocol), not xterm's
# modifyOtherKeys format.
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -g allow-passthrough on

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

unbind r
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf

# renumber windows when a window is closed
set -g renumber-windows on
# set terminal title
set -g set-titles on
# slightly longer pane indicators display time
set -g display-panes-time 800
# slightly longer status messages display time
set -g display-time 1000
# redraw status line every 10 seconds
set -g status-interval 10
# reduce escape time
set -s escape-time 10
# increase history
set-option -g history-limit 10000

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# maximize current pane (zoom toggle)
bind + resize-pane -Z

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation
unbind n
unbind p
bind -r C-h previous-window # select previous window
bind -r C-l next-window     # select next window
bind Tab last-window        # move to last active window

# toggle mouse
bind m set -g mouse \; display-message "Mouse #{?mouse,ON,OFF}"

set -g mouse on

set-window-option -g mode-keys vi

# -- copy mode -----------------------------------------------------------------
bind Enter copy-mode # enter copy mode

# vi-style copy mode bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# Clipboard: copy-mode `y` above reaches the system clipboard via
# `set-clipboard on` (OSC 52); no xsel/xclip/pbcopy plumbing needed.

# Theme: Catppuccin Mocha (https://github.com/catppuccin/catppuccin)
# ==============================================
# ===   Theme Configuration                  ===
# ==============================================
# Status bar
set -g status-style bg='#1e1e2e',fg='#89b4fa'

# Pane borders
set -g pane-border-style fg='#45475a'
set -g pane-active-border-style fg='#89b4fa'

# Window status
set -g window-status-style fg='#a6adc8',bg='#1e1e2e'
set -g window-status-current-style fg='#cdd6f4',bg='#313244',bold
set -g window-status-activity-style fg='#f5c2e7',bg='#1e1e2e'
set -g window-status-bell-style fg='#f9e2af',bg='#1e1e2e'

# Message and command line
set -g message-style fg='#cdd6f4',bg='#313244'
set -g message-command-style fg='#cdd6f4',bg='#313244'

# Clock mode
set -g clock-mode-colour '#89b4fa'

# Copy mode
set -g mode-style fg='#1e1e2e',bg='#cba6f7'

# tmux-sessionizer
# Running tms will find the repos and fuzzy find on them.
bind C-o display-popup -E "tms"
# Show other active sessions with a fuzzy finder and a preview window.
bind C-j display-popup -E "tms switch"
# Show other active windows in the current session with a fuzzy finder and a preview window.
bind C-k display-popup -E "tms windows"
# The 'tms sessions' command can be used to get a styled output of the active
# sessions with an asterisk on the current session.
# #(tma status) is tma's required ambient driver: it refreshes agent state
# every status-interval and prints blocked/working/done counts.
set -g status-right "#(tma status)"
# If this configuration is used it can be helpful to rebind the default tmux keys for switching sessions
# so that the status bar is refreshed on every session switch.
bind -r '(' switch-client -p\; refresh-client -S
bind -r ')' switch-client -n\; refresh-client -S
# Using this command you can automatically rename the active session along with the directory name
# and the active directory inside all the panes in the active session will be changed to the renamed directory
bind C-w command-prompt -p "Rename active session to: " "run-shell 'tms rename %1'"
# Using this command you can automatically generate missing worktree windows for
# the active session or a provided session_name.
bind C-r "run-shell 'tms refresh'"

# tmux-agents (tma)
# The keybindings come from `tma install-keys`, sourced at the bottom of this
# file. Only the per-window agent rollup is set here: the managed file does not
# touch window-status-format.
set -g window-status-format '#I:#W#F#{@agent_summary}'
set -g window-status-current-format '#I:#W#F#{@agent_summary}'
# Nix makeWrapper binaries exec as `.foo-wrapped`, truncated by the kernel's
# 16-char comm (`.opencode-wrapp`), and automatic-rename would name windows
# after that. Strip the decoration so windows show `opencode`, `claude`, ...
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{s/-wrapp.*$//:#{s/^\.//:pane_current_command}}}#{?pane_dead,[dead],}'

# tpm plugin
# Check if TPM is installed
if-shell "test ! -d $XDG_DATA_HOME/tmux/plugins/tpm" "run-shell 'git clone https://github.com/tmux-plugins/tpm $XDG_DATA_HOME/tmux/plugins/tpm'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-copycat'

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$XDG_DATA_HOME/tmux/plugins"
# Initialize TMUX plugin manager
run "$XDG_DATA_HOME/tmux/plugins/tpm/tpm"

# ==============================================
# ===   Nesting local and remote sessions     ===
# ==============================================
# see: toggle on/off all keybindings · Issue #237 · tmux/tmux - https://github.com/tmux/tmux/issues/237
# Also, change some visual styles when window keys are off
bind -T root F12  \
    set prefix None \;\
    set key-table off \;\
    set status-style "bg=#1e1e2e,fg=#f9e2af" \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

source-file -q "$XDG_CONFIG_HOME/tma/tmux.conf" "$HOME/.config/tma/tmux.conf" # tma keys
