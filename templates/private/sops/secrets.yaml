# PLACEHOLDER: this file is NOT encrypted yet.
#
# Replace it before your first switch:
#   1. put real age recipients in sops/.sops.yaml
#   2. replace the placeholder values with the real ones
#   3. sops --config sops/.sops.yaml encrypt --in-place sops/secrets.yaml
#
# Every upstream module you import demands its own keys here, whether or not
# this machine uses them, and sops.validateSopsFiles turns a missing one into a
# build failure. See docs/upstream-contract.md before adding modules.
#
# Rename `example` to match modules/users/ and home-profiles/.
passwords:
  # mkpasswd -m sha-512
  example: "$6$REPLACE$ME"
private_keys:
  # contents of ~/.ssh/id_ed25519 for that user
  example: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE ME
    -----END OPENSSH PRIVATE KEY-----
# Optional: uncomment apiKeys in home-profiles/example/default.nix and add
# tokens here with sops. Use unquoted shell-variable names (e.g.
# example_api_key); the local module discovers SOPS-encrypted scalar entries.
api_keys: {}
